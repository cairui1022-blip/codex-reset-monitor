services:
  - type: web
    name: codex-reset-monitor
    runtime: python
    buildCommand: pip install -r requirements.txt && export PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.playwright-browsers && playwright install --with-deps chromium && echo "=== Chromium install done ===" && find /opt/render/project/src/.playwright-browsers -name "chrome*" -o -name "chromium*" 2>/dev/null | head -20
    startCommand: python main.py
    plan: free
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.playwright-browsers
      - key: RSSHUB_BASE_URL
        value: https://rsshub.app
      - key: TIBO_USERNAME
        value: thsottiaux
      - key: POLL_INTERVAL_MIN
        value: "10"
      - key: STORE_PATH
        value: ./data/app.db
      - key: WEB_HOST
        value: "0.0.0.0"
      - key: WEB_PORT
        fromService:
          type: web
          name: codex-reset-monitor
          property: port
      - key: API_SECRET
        generateValue: true
      # 以下环境变量在 Render 控制台手动填写
      # PUSHPLUS_TOKEN     - PushPlus 微信推送 token（群组主 token）
      # PUSHPLUS_TOPIC     - PushPlus 群组编码（可选）
      # WECOM_WEBHOOK      - 企业微信群机器人 webhook（可选）
      # TG_BOT_TOKEN       - Telegram Bot Token（可选）
      # TG_CHAT_ID         - Telegram Chat ID（可选）
      # SMS_PROVIDER       - aliyun 或 tencent（可选）
      # HTTP_PROXY         - 代理地址（部署在国内时填写）
