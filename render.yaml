services:
  - type: web
    name: codex-reset-monitor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    envVars:
      - key: TIBO_USERNAME
        value: thsottiaux
      - key: TIBO_USER_ID
        value: "1267893715938840576"
      - key: POLL_INTERVAL_MIN
        value: "10"
      - key: STORE_PATH
        value: /tmp/codex_app.db
      - key: WEB_HOST
        value: "0.0.0.0"
      - key: WEB_PORT
        fromService:
          type: web
          name: codex-reset-monitor
          property: port
      - key: API_SECRET
        generateValue: true
      # 以下环境变量在 Render 控制台手动填写
      # PUSHPLUS_TOKEN     - PushPlus 微信推送 token（群组主 token）
      # PUSHPLUS_TOPIC     - PushPlus 群组编码（可选）
      # SMS_PROVIDER       - aliyun 或 tencent（可选）
